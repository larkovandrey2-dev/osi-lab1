name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: |
          cmake -S . -B build
          cmake --build build --config Debug
      - name: Check Windows
        if: runner.os == 'Windows'
        shell: bash
        working-directory: build/Debug
        run: |
          result=$(printf 'Hello WORLD\n' | ./parent.exe)
          test "$result" = 'hello_world_'
